services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudriskiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudriskiq}
      POSTGRES_DB: ${POSTGRES_DB:-cloudriskiq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudriskiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudriskiq}:${POSTGRES_PASSWORD:-cloudriskiq}@db:5432/${POSTGRES_DB:-cloudriskiq}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # The image is built from backend/ only. This mount is what the API reads.
      SAMPLE_DATA_DIR: /sample-data
    volumes:
      - ./sample-data:/sample-data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
